name: EventPulse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Build frontend
        working-directory: ./client
        run: npm run build

      - name: Validate backend syntax
        working-directory: ./server
        run: node --check index.js

      - name: Security audit
        working-directory: ./server
        run: npm audit --omit=dev --audit-level=high

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eventpulse-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/eventpulse-backend:latest
     
      - name: Build and push frontend Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eventpulse-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/eventpulse-frontend:latest

              deploy:
    name: Deploy to local Minikube
    runs-on: self-hosted
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Verify Kubernetes connection
        shell: powershell
        run: |
          kubectl config current-context
          kubectl get deployments

      - name: Deploy backend
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $image = "$env:DOCKERHUB_USERNAME/eventpulse-backend:$env:IMAGE_TAG"
          kubectl set image deployment/eventpulse-backend eventpulse-backend=$image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy frontend
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $image = "$env:DOCKERHUB_USERNAME/eventpulse-frontend:$env:IMAGE_TAG"
          kubectl set image deployment/eventpulse-frontend eventpulse-frontend=$image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify deployment rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/eventpulse-backend --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          kubectl rollout status deployment/eventpulse-frontend --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check final pod status
        shell: powershell
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services